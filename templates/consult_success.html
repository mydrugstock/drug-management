<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>สร้าง Consult สำเร็จ</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.85) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes bounceCheck {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        @keyframes blobMove {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -20px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }

        body {
            font-family: 'Kanit', Arial, sans-serif;
            background: linear-gradient(120deg, #ecfdf5, #eef2ff, #ecfeff);
            background-size: 300% 300%;
            animation: gradientShift 18s ease infinite;
            padding: 40px;
            margin: 0;
            position: relative;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.3;
            z-index: 0;
            animation: blobMove 16s ease-in-out infinite;
        }

        body::before {
            width: 320px;
            height: 320px;
            background: #6ee7b7;
            top: -100px;
            left: -90px;
        }

        body::after {
            width: 300px;
            height: 300px;
            background: #a78bfa;
            bottom: -100px;
            right: -80px;
            animation-delay: -6s;
        }

        .box {
            max-width: 650px;
            margin: auto;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(6px);
            padding: 40px;
            border-radius: 22px;
            text-align: center;
            box-shadow: 0 10px 32px rgba(16,185,129,0.15);
            animation: popIn 0.5s ease;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .box::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 5px;
            background: linear-gradient(90deg, #16a34a, #2563eb, #06b6d4);
        }

        .success {
            color: #166534;
            font-size: 24px;
            font-weight: 800;
            display: inline-block;
            animation: bounceCheck 1.6s ease-in-out infinite;
        }

        p {
            color: #6b6392;
            line-height: 1.6;
        }

        .pdf-button {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 28px;
            background: linear-gradient(90deg, #2563eb, #06b6d4);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
            box-shadow: 0 6px 18px rgba(37,99,235,0.35);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .pdf-button:hover {
            transform: translateY(-3px) scale(1.03);
        }

        .back {
            display: block;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .back:hover {
            transform: translateX(-4px);
        }

    </style>

</head>

<body>

<div class="box">

    <div class="success">
        ✅ สร้าง Consult PDF สำเร็จ
    </div>

    <p>
        ระบบสร้างเอกสาร Consult
        สำหรับส่งให้แพทย์เรียบร้อยแล้ว
    </p>

    <p style="background:#f8fafc;border-radius:10px;padding:10px 14px;display:inline-block;">
        ไฟล์:
        <strong>
            {{ filename }}
        </strong>
    </p>

    <a class="pdf-button"
       href="/static/consults/{{ filename }}"
       target="_blank">

        📄 เปิด Consult PDF

    </a>

    <a class="back"
       href="/prescription">

        ← กลับไปตรวจใบสั่งยา

    </a>

</div>

</body>

</html>
