<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <title>{{ title }}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.85) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes blobMove {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -20px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }

        body {
            font-family: 'Kanit', Arial, sans-serif;
            background: linear-gradient(120deg, #eef2ff, #ecfeff, #fdf4ff);
            background-size: 300% 300%;
            animation: gradientShift 18s ease infinite;
            margin: 0;
            padding: 50px;
            position: relative;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.3;
            z-index: 0;
            animation: blobMove 16s ease-in-out infinite;
        }

        body::before {
            width: 320px;
            height: 320px;
            background: #a78bfa;
            top: -100px;
            left: -90px;
        }

        body::after {
            width: 300px;
            height: 300px;
            background: #22d3ee;
            bottom: -100px;
            right: -80px;
            animation-delay: -6s;
        }

        .card {
            max-width: 650px;
            margin: auto;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(6px);
            padding: 40px;
            border-radius: 22px;
            text-align: center;
            box-shadow: 0 10px 32px rgba(76, 29, 149, 0.15);
            animation: popIn 0.5s ease;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 5px;
            background: linear-gradient(90deg, #7c3aed, #2563eb, #06b6d4);
        }

        .success {
            font-size: 64px;
            animation: bounce 1.6s ease-in-out infinite;
        }

        .error {
            font-size: 64px;
            animation: bounce 1.6s ease-in-out infinite;
        }

        h1 {
            color: #4c1d95;
            font-weight: 800;
        }

        p {
            color: #6b6392;
            line-height: 1.7;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background: linear-gradient(90deg, #4c1d95, #2563eb);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
            box-shadow: 0 6px 16px rgba(76,29,149,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        a:hover {
            transform: translateY(-3px) scale(1.03);
        }

    </style>

</head>

<body>

<div class="card">

    {% if success %}

        <div class="success">
            ✅
        </div>

    {% else %}

        <div class="error">
            ❌
        </div>

    {% endif %}


    <h1>
        {{ title }}
    </h1>


    <p>
        {{ message }}
    </p>


    <a href="/prescription">
        ← กลับไปหน้าตรวจใบสั่งยา
    </a>


    <br>


    <a href="/history">
        📋 ดูประวัติ
    </a>

</div>

</body>

</html>
